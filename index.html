<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendario">
<title>Calendario 2026–2099</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#16202e;--mut:#66717f;--line:#dde2e8;--acc:#0f766e;--accfg:#fff;--hol:#c0262d;--holbg:#fbe9ea;--wkbg:#eef1f4;--fin:#5b3fc4;--finbg:#ece8fb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161e;--card:#18212c;--fg:#e8edf3;--mut:#93a0ae;--line:#2a3643;--acc:#2dd4bf;--accfg:#06201c;--hol:#ff8a8f;--holbg:#3a2226;--wkbg:#1d2833;--fin:#b9acff;--finbg:#2a2647;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161e;--card:#18212c;--fg:#e8edf3;--mut:#93a0ae;--line:#2a3643;--acc:#2dd4bf;--accfg:#06201c;--hol:#ff8a8f;--holbg:#3a2226;--wkbg:#1d2833;--fin:#b9acff;--finbg:#2a2647;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:520px;margin:0 auto;padding:16px 14px 28px}
h1{font:400 30px/1.1 Georgia,"Times New Roman",serif;margin:4px 0 14px;text-transform:capitalize}
h1 small{font:500 16px system-ui,sans-serif;color:var(--mut);margin-left:6px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.nav{width:44px;padding:0;font-size:20px}
.sp{flex:1}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0;border-left:0}
.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.g{display:grid;grid-template-columns:30px repeat(7,1fr);gap:3px;text-align:center}
.g.mini{grid-template-columns:repeat(7,1fr);gap:1px;font-size:11px}
.dn{font-size:12px;color:var(--mut);padding:4px 0;font-weight:600}
.wk{font-size:11px;color:var(--mut);background:var(--wkbg);border-radius:6px;display:flex;align-items:center;justify-content:center}
.d{position:relative;cursor:pointer;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-variant-numeric:tabular-nums}
.mini .d{aspect-ratio:auto;height:19px;border-radius:5px}
.d.fin{background:var(--finbg);color:var(--fin)}
.dn.fin{color:var(--fin)}
.d.fest{background:var(--holbg);color:var(--hol);font-weight:700}
.d.hoy{background:var(--acc);color:var(--accfg);font-weight:700}
.year{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.year .card{padding:8px;cursor:pointer;text-align:center}
.year h3{margin:0 0 4px;font:400 16px Georgia,serif;text-transform:capitalize}
.fl{margin:14px 2px 0;padding:0;list-style:none}
.fl li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fl b{min-width:70px;max-width:45%;flex:none;color:var(--hol);font-weight:600}
.nota{color:var(--mut);font-size:12px;margin-top:14px}
.d.cn::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:currentColor}
.mini .d.cn::after{bottom:1px;width:3px;height:3px}
.d:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.fl li[data-d]{cursor:pointer}
.fl b.nb{color:var(--acc)}
.fl span{white-space:pre-wrap;overflow-wrap:anywhere}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.on{display:flex}
.sheet{display:flex;flex-direction:column;max-height:92vh;max-height:92dvh;background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:400 20px Georgia,serif;margin:0 0 4px}
.sheet p{margin:0 0 10px;color:var(--hol);font-size:14px}
.sheet textarea{width:100%;min-height:110px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;margin-top:8px}
.hrs{position:relative;overflow-y:auto;min-height:0;flex:1;margin-top:6px}
.hr{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:4px 0}
.hr.all{position:sticky;top:0;z-index:1;background:var(--card)}
.hr label{flex:none;width:60px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;line-height:1.15}
.hr input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
.hr input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#ovV.on{background:var(--hol);color:#fff;border-color:var(--hol)}
.msg{font-size:13px;color:var(--mut);margin-top:6px}
.msg:empty{display:none}
</style>
</head>
<body>
<div class="app">
  <h1 id="tit"></h1>
  <div class="bar">
    <button class="nav" id="prev" aria-label="Anterior">‹</button>
    <button class="nav" id="next" aria-label="Siguiente">›</button>
    <select id="selM" aria-label="Mes"></select>
    <select id="selY" aria-label="Año"></select>
  </div>
  <div class="bar">
    <div class="seg"><button id="bMes" class="on">Mes</button><button id="bAnio">Año</button></div>
    <span class="sp"></span>
    <button id="hoy">Hoy</button>
  </div>
  <div id="view"></div>
  <ul class="fl" id="fl"></ul>
  <p class="nota">Semanas de lunes a domingo con numeración ISO. Se marcan los festivos nacionales de España; cada comunidad añade los suyos. Toca un día para añadir notas de todo el día o por horas.</p>
</div>
<div id="ov" role="dialog" aria-modal="true" aria-labelledby="ovT"><div class="sheet"><h2 id="ovT"></h2><p id="ovF"></p><div id="ovH" class="hrs"></div><div id="ovM" class="msg" aria-live="polite"></div><div class="acts"><button id="ovS" class="pri">Guardar nota</button><button id="ovV" aria-pressed="false">🎤 Dictar</button><button id="ovD">Borrar</button><span class="sp"></span><button id="ovC">Cerrar</button></div></div></div>
<script>
var MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var DS=["L","M","X","J","V","S","D"],MIN=2026,MAX=2099;
var t=new Date(),TY=t.getFullYear(),TM=t.getMonth(),TD=t.getDate();
var inR=TY>=MIN&&TY<=MAX,y=inR?TY:MIN,m=inR?TM:0,mode="mes",cache={};
function $(i){return document.getElementById(i)}
var NK="calendario-notas",N={},cur=0,WD=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function norm(v){if(typeof v=="string")return{t:v,h:{}};return v&&typeof v=="object"?{t:v.t||"",h:v.h||{}}:{t:"",h:{}}}
function has(o){if(!o)return false;if(o.t)return true;for(var i in o.h)if(o.h[i])return true;return false}
try{N=JSON.parse(localStorage.getItem(NK)||"{}")||{}}catch(e){N={}}
for(var k0 in N)N[k0]=norm(N[k0]);
var curF=null;
(function(){var s='<div class="hr all"><label for="hx">Todo el día</label><input id="hx" maxlength="300" placeholder="Nota de todo el día"></div>';for(var i=0;i<24;i++)s+='<div class="hr"><label for="h'+i+'">'+(i<10?"0":"")+i+':00</label><input id="h'+i+'" maxlength="200"></div>';$("ovH").innerHTML=s})();
$("ovH").addEventListener("focusin",function(e){if(e.target.tagName=="INPUT")curF=e.target});
function saveN(){try{localStorage.setItem(NK,JSON.stringify(N))}catch(e){}}
function key(Y,M,d){return Y+"-"+(M+1)+"-"+d}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function openN(d){cur=d;var f=hol(y)[m+"-"+d],k=key(y,m,d);$("ovT").textContent=WD[new Date(y,m,d).getDay()]+", "+d+" de "+MES[m]+" de "+y;$("ovF").textContent=f||"";$("ovF").style.display=f?"":"none";var o=norm(N[k]),i,s=7;$("hx").value=o.t;for(i=0;i<24;i++)$("h"+i).value=o.h[i]||"";for(i=23;i>=0;i--)if(o.h[i])s=i;$("ovD").style.display=has(N[k])?"":"none";$("ovM").textContent="";curF=$("hx");$("ov").className="on";$("ovH").scrollTop=$("h"+s).parentNode.offsetTop-$("hx").parentNode.offsetHeight}
function closeN(){stopV();$("ovM").textContent="";$("ov").className=""}
function setN(clear){var k=key(y,m,cur),o={t:$("hx").value.trim(),h:{}};for(var i=0;i<24;i++){var v=$("h"+i).value.trim();if(v)o.h[i]=v}if(!clear&&has(o))N[k]=o;else delete N[k];saveN();closeN();render()}
$("ovS").onclick=function(){setN(false)};
$("ovD").onclick=function(){setN(true)};
$("ovC").onclick=closeN;
$("ov").onclick=function(e){if(e.target===this)closeN()};
$("fl").onclick=function(e){var l=e.target.closest("li[data-d]");if(l)openN(+l.getAttribute("data-d"))};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
function stopV(){if(rec){try{rec.stop()}catch(e){}}}
function micUI(on){$("ovV").className=on?"on":"";$("ovV").setAttribute("aria-pressed",on?"true":"false");$("ovV").textContent=on?"⏹ Parar":"🎤 Dictar"}
if(!SR)$("ovV").style.display="none";
function startV(){
  var r=new SR(),ta=curF,base=ta.value.replace(/\s+$/,"");
  r.lang="es-ES";r.interimResults=true;r.continuous=false;
  r.onresult=function(e){var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;ta.value=(base?base+" ":"")+t.trim()};
  r.onerror=function(e){$("ovM").textContent=(e.error=="not-allowed"||e.error=="service-not-allowed")?"El navegador bloquea el micrófono en esta página. Si la abres desde Claude o desde un archivo local no funcionará: usa la app instalada desde tu hosting, o toca el cuadro de texto y usa el micrófono del teclado del móvil.":e.error=="no-speech"?"No se ha oído nada. Inténtalo de nuevo.":"No se ha podido dictar ("+e.error+")."};
  r.onend=function(){rec=null;micUI(false);if($("ovM").textContent.indexOf("Escuchando")==0)$("ovM").textContent=""};
  $("ovM").textContent="Escuchando ("+ta.parentNode.firstChild.textContent+")… si el navegador lo pide, pulsa Permitir.";
  try{r.start();rec=r;micUI(true)}catch(e){$("ovM").textContent="No se ha podido iniciar el dictado."}
}
$("ovV").onclick=function(){
  if(rec){stopV();return}
  var pp=document.permissionsPolicy||document.featurePolicy;
  if(pp&&pp.allowsFeature&&!pp.allowsFeature("microphone")){$("ovM").textContent="Esta página está incrustada en otra y el micrófono está bloqueado desde fuera. Descarga el archivo o abre la app instalada para dictar.";return}
  startV();
};
function easter(Y){var a=Y%19,b=Math.floor(Y/100),c=Y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31),da=((h+l-7*mm+114)%31)+1;return new Date(Y,mo-1,da)}
function hol(Y){if(cache[Y])return cache[Y];
  var H={"0-1":"Año Nuevo","0-6":"Epifanía del Señor","4-1":"Fiesta del Trabajo","7-15":"Asunción de la Virgen","9-12":"Fiesta Nacional de España","10-1":"Todos los Santos","11-6":"Día de la Constitución","11-8":"Inmaculada Concepción","11-25":"Navidad"};
  var e=easter(Y);e.setDate(e.getDate()-2);H[e.getMonth()+"-"+e.getDate()]="Viernes Santo";
  return cache[Y]=H}
function isoWeek(d){var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);var s=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil(((x-s)/864e5+1)/7)}
function grid(Y,M,mini){
  var off=(new Date(Y,M,1).getDay()+6)%7,n=new Date(Y,M+1,0).getDate(),H=hol(Y),tot=Math.ceil((off+n)/7)*7;
  var h='<div class="g'+(mini?' mini':'')+'">';
  if(!mini)h+='<div class="dn"></div>';
  for(var k=0;k<7;k++)h+='<div class="dn'+(k>4?' fin':'')+'">'+DS[k]+'</div>';
  for(var i=0;i<tot;i++){
    if(!mini&&i%7==0)h+='<div class="wk">'+isoWeek(new Date(Y,M,Math.max(1,i-off+1)))+'</div>';
    var d=i-off+1;
    if(d<1||d>n){h+='<div class="d"></div>';continue}
    var c="d";if(i%7>=5)c+=" fin";if(H[M+"-"+d])c+=" fest";if(has(N[key(Y,M,d)]))c+=" cn";if(Y==TY&&M==TM&&d==TD)c+=" hoy";
    h+='<div class="'+c+'" data-d="'+d+'"'+(mini?'':' tabindex="0" role="button"')+'>'+d+'</div>'}
  return h+'</div>'}
function render(){
  $("selM").value=m;$("selY").value=y;
  $("bMes").className=mode=="mes"?"on":"";$("bAnio").className=mode=="anio"?"on":"";
  $("selM").style.display=mode=="mes"?"":"none";
  var v="",f="";
  if(mode=="mes"){
    $("tit").innerHTML=MES[m]+'<small>'+y+'</small>';
    v='<div class="card">'+grid(y,m,false)+'</div>';
    var H=hol(y),L=[];
    for(var k in H){var p=k.split("-");if(+p[0]==m)L.push([+p[1],H[k],"h"])}
    for(var q in N){var p2=q.split("-");if(+p2[0]==y&&+p2[1]==m+1){var o=N[q];if(o.t)L.push([+p2[2],o.t,"n",""]);for(var i in o.h)L.push([+p2[2],o.h[i],"n",(i<10?"0":"")+i+":00"])}}
    L.sort(function(a,b){var x=a[3]||"",z=b[3]||"";return a[0]-b[0]||(a[2]<b[2]?-1:a[2]>b[2]?1:(x<z?-1:x>z?1:0))});
    L.forEach(function(r){f+='<li data-d="'+r[0]+'"><b'+(r[2]=="n"?' class="nb"':'')+'>'+r[0]+' de '+MES[m]+(r[3]?' · '+r[3]:'')+'</b><span>'+esc(r[1])+'</span></li>'});
  }else{
    $("tit").textContent=y;
    v='<div class="year">';
    for(var i=0;i<12;i++)v+='<div class="card" data-m="'+i+'"><h3>'+MES[i]+'</h3>'+grid(y,i,true)+'</div>';
    v+='</div>'}
  $("view").innerHTML=v;$("fl").innerHTML=f;
  var a=mode=="mes"?(y*12+m):y,lo=mode=="mes"?MIN*12:MIN,hi=mode=="mes"?MAX*12+11:MAX;
  $("prev").disabled=a<=lo;$("next").disabled=a>=hi;
  document.title="Calendario "+(mode=="mes"?MES[m]+" ":"")+y}
function go(dx){
  if(mode=="mes"){m+=dx;if(m<0){m=11;y--}if(m>11){m=0;y++}}else y+=dx;
  if(y<MIN){y=MIN;m=0}if(y>MAX){y=MAX;m=11}
  render()}
MES.forEach(function(n,i){var o=document.createElement("option");o.value=i;o.textContent=n.charAt(0).toUpperCase()+n.slice(1);$("selM").appendChild(o)});
for(var Y=MIN;Y<=MAX;Y++){var o=document.createElement("option");o.value=Y;o.textContent=Y;$("selY").appendChild(o)}
$("prev").onclick=function(){go(-1)};$("next").onclick=function(){go(1)};
$("selM").onchange=function(){m=+this.value;render()};
$("selY").onchange=function(){y=+this.value;render()};
$("bMes").onclick=function(){mode="mes";render()};$("bAnio").onclick=function(){mode="anio";render()};
$("hoy").onclick=function(){if(inR){y=TY;m=TM}else{y=MIN;m=0}render()};
$("view").onclick=function(e){var c=e.target.closest("[data-m]");if(c){m=+c.getAttribute("data-m");mode="mes";render();return}var q=e.target.closest(".d[data-d]");if(q&&mode=="mes")openN(+q.getAttribute("data-d"))};
document.onkeydown=function(e){if(e.key=="Escape"){closeN();return}if($("ov").className=="on"||e.target.tagName=="SELECT"||e.target.tagName=="TEXTAREA")return;if(e.key=="Enter"&&e.target.classList&&e.target.classList.contains("d")){e.target.click();return}if(e.key=="ArrowLeft")go(-1);if(e.key=="ArrowRight")go(1)};
render();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js')})}</script>
</body>
</html>
