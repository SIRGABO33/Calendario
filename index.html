<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#16202e;--mut:#66717f;--line:#dde2e8;--acc:#0f766e;--accfg:#fff;--hol:#c0262d;--holbg:#fbe9ea;--wkbg:#eef1f4;--fin:#5b3fc4;--finbg:#ece8fb;--c-y:#fde047;--c-o:#fdba74;--c-r:#fca5a5;--c-p:#f9a8d4;--c-v:#c4b5fd;--c-b:#93c5fd;--c-g:#86efac;--c-k:#cbd5e1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161e;--card:#18212c;--fg:#e8edf3;--mut:#93a0ae;--line:#2a3643;--acc:#2dd4bf;--accfg:#06201c;--hol:#ff8a8f;--holbg:#3a2226;--wkbg:#1d2833;--fin:#b9acff;--finbg:#2a2647;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161e;--card:#18212c;--fg:#e8edf3;--mut:#93a0ae;--line:#2a3643;--acc:#2dd4bf;--accfg:#06201c;--hol:#ff8a8f;--holbg:#3a2226;--wkbg:#1d2833;--fin:#b9acff;--finbg:#2a2647;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:520px;margin:0 auto;padding:16px 14px 28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.nav{width:44px;padding:0;font-size:20px}
#prev{order:0}#selM{order:1;margin-left:auto}#selY{order:2}#next{order:3;margin-left:auto}
#selM[style*="none"]+#selY{margin-left:auto}
#selM{font:400 24px/1.1 Georgia,"Times New Roman",serif;border-color:transparent;background:transparent;padding:4px;min-height:44px}
#selY{font:500 18px system-ui,sans-serif;color:var(--mut);border-color:transparent;background:transparent;padding:4px;min-height:44px}
.sp{flex:1}
.seg{display:flex}
.seg button{border-radius:0;flex:1}
.seg button+button{border-left:0}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.bar .seg{flex:none}
.bar .seg button{flex:none}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.leg:empty{display:none}
.lg{display:flex;align-items:center;gap:6px;min-height:32px;padding:2px 10px;font-size:13px;border-radius:16px}
.lg i,.sq{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.sq{border-radius:3px;margin-right:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.g{display:grid;grid-template-columns:30px repeat(7,1fr);gap:3px;text-align:center}
.g.mini{grid-template-columns:repeat(7,1fr);gap:1px;font-size:11px}
.dn{font-size:12px;color:var(--mut);padding:4px 0;font-weight:600}
.dn.fin{color:var(--fin)}
.wk{font-size:11px;color:var(--mut);background:var(--wkbg);border-radius:6px;display:flex;align-items:center;justify-content:center}
.d{position:relative;cursor:pointer;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;transition:transform .15s ease,background-color .25s ease,box-shadow .25s ease}
.mini .d{aspect-ratio:auto;height:19px;border-radius:5px}
.d.fin{background:var(--finbg);color:var(--fin)}
.d.fest{background:var(--holbg);color:var(--hol);font-weight:700}
.d.hoy{background:var(--acc);color:var(--accfg);font-weight:700}
.d.kc{background:linear-gradient(135deg,var(--a) 50%,var(--b,var(--a)) 50%);color:#1a1a1a;font-weight:600}
.d.hoy.kc{box-shadow:inset 0 0 0 2px var(--acc)}
.d.gtc{background:linear-gradient(125deg,#ff2e93,#ff7a3d,#ffc84a,#b84dff,#26d0ce,#ff2e93);background-size:300% 300%;animation:vice 6s ease-in-out infinite;color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.6);overflow:hidden}
.d.gtc::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.8s linear infinite}
.d.gtc.sel{animation:pop .35s cubic-bezier(.34,1.56,.64,1),vice 6s ease-in-out infinite}
@keyframes vice{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes shine{from{background-position:160% 0}to{background-position:-60% 0}}
.d.cn::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:currentColor}
.mini .d.cn::after{bottom:1px;width:3px;height:3px}
.gt{position:absolute;top:1px;right:2px;font-size:11px;font-style:normal;line-height:1}
.mini .gt{font-size:8px;top:0;right:0}
.d:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.d:active{transform:scale(.9)}
.d.sel{box-shadow:inset 0 0 0 2px var(--acc);animation:pop .35s cubic-bezier(.34,1.56,.64,1);z-index:1}
.d.sel:not(.fin):not(.fest):not(.hoy):not(.kc):not(.gtc){background:rgba(15,118,110,.14);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.d.sel.hoy{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.year{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.year .card{padding:8px;cursor:pointer;text-align:center}
.year h3{margin:0 0 4px;font:400 16px Georgia,serif;text-transform:capitalize}
.fl{margin:14px 2px 0;padding:0;list-style:none}
.fl li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.fl b{min-width:70px;max-width:45%;flex:none;color:var(--hol);font-weight:600}
.fl b.nb{color:var(--acc)}
.fl b.gb{color:var(--fin)}
.fl span{white-space:pre-wrap;overflow-wrap:anywhere}
.nota{color:var(--mut);font-size:12px;margin-top:14px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.on{display:flex;animation:fadein .22s ease-out}
.sheet{display:flex;flex-direction:column;max-height:92vh;max-height:92dvh;background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#ov.on .sheet{animation:slideup .32s cubic-bezier(.2,.8,.2,1)}
.sheet h2{font:400 20px Georgia,serif;margin:0 0 4px}
.sheet p{margin:0 0 10px;color:var(--hol);font-size:14px}
.hd{flex:none;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hl{flex:1;min-width:0}
.tags{flex:none;max-width:46%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.tg{font-size:12px;line-height:1.25;padding:3px 8px;border-radius:10px;background:var(--wkbg);color:var(--fg);text-align:right}

.ss{top:1px;left:2px}
.mn{bottom:1px;right:2px}
.gtab{flex:none;position:relative;overflow:hidden;border-radius:14px;margin:8px 0 6px;padding:14px 10px 12px;text-align:center;background:linear-gradient(125deg,#ff2e93,#ff7a3d,#ffc84a,#b84dff,#26d0ce,#ff2e93);background-size:300% 300%;animation:vice 6s ease-in-out infinite}
.gtab::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.8s linear infinite}
.sun{position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:radial-gradient(circle,#fff6b0 0%,rgba(255,209,102,.8) 35%,rgba(255,122,61,0) 70%);animation:sunp 3s ease-in-out infinite}
.pm{position:absolute;bottom:-4px;width:46px;height:64px;transform-origin:50% 100%}
.pm.l{left:8px;animation:sway 4s ease-in-out infinite}
.pm.r{right:8px;animation:swayr 4.6s ease-in-out infinite}
.gl{display:block;position:relative;z-index:2;font:900 46px/1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:.03em;color:#fff;-webkit-text-stroke:3px #2a0a45;paint-order:stroke fill;text-shadow:3px 3px 0 #ff2e93,0 0 18px rgba(255,46,147,.85);animation:glow 2.4s ease-in-out infinite}
.gs{display:block;position:relative;z-index:2;margin-top:6px;font:700 12px system-ui,sans-serif;letter-spacing:.22em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65)}
@keyframes sunp{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.15);opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes swayr{0%,100%{transform:scaleX(-1) rotate(-4deg)}50%{transform:scaleX(-1) rotate(4deg)}}
@keyframes glow{0%,100%{text-shadow:3px 3px 0 #ff2e93,0 0 14px rgba(255,46,147,.7)}50%{text-shadow:3px 3px 0 #ff2e93,0 0 28px rgba(255,255,255,.95)}}
#vD{display:flex;flex-direction:column;min-height:0;flex:1}
#vE,#vC{overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain}
.hrs{position:relative;overflow-y:auto;min-height:0;flex:1;margin-top:6px;overscroll-behavior:contain}
.hr{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:4px 0;min-height:46px}
.hr.all{position:sticky;top:0;z-index:1;background:var(--card)}
.hr label{flex:none;width:60px;font-size:13px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.cs{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ch{text-align:left;min-height:34px;padding:4px 10px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.ch[style]{color:#1a1a1a;border-color:transparent}
.ad{flex:none;width:40px;padding:0;font-size:20px;color:var(--acc)}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:13px;color:var(--mut)}
.fld input,.fld select{font-size:16px;width:100%;background:var(--bg)}
.row{display:flex;gap:8px}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;padding:0;border:2px solid var(--line);min-height:0}
.sw.none{background:var(--bg);font-size:14px}
.sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#eV.on{background:var(--hol);color:#fff;border-color:var(--hol)}
.msg{font-size:13px;color:var(--mut);margin-top:6px}
.msg:empty{display:none}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:496px;margin:0 auto;background:var(--acc);color:var(--accfg);padding:12px 14px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);transform:translateY(-160%);transition:transform .3s ease;z-index:30}
#toast.on{transform:none}
@keyframes pop{0%{transform:scale(.78)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#sp{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:opacity .45s ease}
#sp.out{opacity:0;pointer-events:none}
#sp .ver{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;font-size:13px;color:var(--mut);animation:rise .6s .6s both ease-out}
#sp .ver b{margin-left:6px;padding:2px 8px;border-radius:10px;background:var(--acc);color:var(--accfg);font-size:11px;letter-spacing:.06em}
#sp svg{width:96px;height:96px;filter:drop-shadow(0 8px 18px rgba(15,118,110,.35));animation:popin .7s cubic-bezier(.34,1.56,.64,1)}
#sp h2{font:400 34px/1.1 Georgia,"Times New Roman",serif;margin:0;animation:rise .6s .25s both ease-out}
#sp p{margin:0;color:var(--mut);animation:rise .6s .4s both ease-out}
#sp p::first-letter{text-transform:uppercase}
@keyframes popin{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideup{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
